# RAG 学术知识引擎 —— 生产 nginx 配置
# 托管前端静态文件 + 反代 /api 到 backend；SSE 流式问答需要关闭缓冲。

upstream rag_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;   # 部署时替换为你的域名，如 rag.example.com

    # certbot HTTP-01 验证路径（签证书用，保留）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;

        # SSE 流式问答：关闭一切缓冲，超时放宽到 10 分钟
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 长连接复用 + 真实客户端信息
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 前端 SPA ----------
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带指纹，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传限制略高于后端单文件 50MB 上限
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ---------- HTTPS 模板 ----------
# 执行 certbot --nginx 签发后，它会自动改写本文件注入 443 配置与 80 跳转；
# 若手动维护，取消注释并替换域名与证书路径：
